name: TrustBridge checks

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install Edge Function dependencies
        working-directory: supabase/functions
        run: npm ci
      - name: Check Edge Functions and report signing dependencies
        working-directory: supabase/functions
        run: |
          npm run check
          npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run export:web
      - name: Install pinned CI browser
        run: npm install --no-save --ignore-scripts --package-lock=false @sparticuz/chromium@153.0.0
      - name: Run browser workflow checks
        run: node tests/run-ci-browser.cjs
