plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'za.co.devpeeps.trustbridge.documents'
version = '0.1.0'

android {
  namespace "za.co.devpeeps.trustbridge.documents"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.4.1"
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
